name: Pruebas Semana 8

on:
  push:
    branches:
      - feature/semanas-8-9-floristeria
  pull_request:
    branches:
      - feature/semanas-8-9-floristeria
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: coverage
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: floristeria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floristeria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: xdebug
          tools: composer:v2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Ejecutar PHPUnit y generar cobertura
        run: |
          mkdir -p coverage
          composer test -- --coverage-text --coverage-clover=coverage/clover.xml

      - name: Ejecutar pruebas pytest
        run: python -m pytest -v

      - name: Revisar estándares PHP
        run: composer lint

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-phpunit
          path: coverage/clover.xml
          if-no-files-found: ignore
